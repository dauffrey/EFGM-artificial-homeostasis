name: AH-EXP-0013 Confirmatory Evaluation

on:
  pull_request:
    branches:
      - ah-exp-0012-results
    paths:
      - .github/workflows/ah-exp-0013-confirmatory.yml

permissions:
  contents: read

jobs:
  confirmatory-evaluation:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout frozen observer implementation
        uses: actions/checkout@v6
        with:
          ref: 35af0e3d19b35d3a300cd67c1476d79f841d97be

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install frozen package
        run: python -m pip install -e .

      - name: Execute AH-EXP-0013 confirmatory holdout
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from ahomeostasis.observation_integrity_warning import evaluate_holdout

          frozen_sha = "35af0e3d19b35d3a300cd67c1476d79f841d97be"
          result = evaluate_holdout()
          payload = {
              "implementation_sha": frozen_sha,
              "run_kind": "first_confirmatory",
              **result,
          }
          output = Path("ah-exp-0013-confirmatory.json")
          output.write_text(json.dumps(payload, indent=2, sort_keys=True), encoding="utf-8")
          file_sha = hashlib.sha256(output.read_bytes()).hexdigest()

          best = payload["best_baseline"]
          summary = {
              "experiment": payload["experiment"],
              "implementation_sha": frozen_sha,
              "status": payload["status"],
              "trajectory_count": payload["trajectory_count"],
              "prediction_count": payload["prediction_count"],
              "positive_label_count": payload["positive_label_count"],
              "negative_label_count": payload["negative_label_count"],
              "harmful_trajectory_count": payload["harmful_trajectory_count"],
              "efgm_confusion": payload["efgm_confusion"],
              "best_baseline": best,
              "best_baseline_confusion": payload["baseline_confusions"][best],
              "delta_ba": payload["delta_ba"],
              "detected_harmful_trajectory_count": payload["detected_harmful_trajectory_count"],
              "missed_harmful_trajectory_count": payload["missed_harmful_trajectory_count"],
              "lead_times": payload["lead_times"],
              "profile_results": payload["profile_results"],
              "canonical_result_hash": payload["canonical_result_hash"],
              "full_trace_hash": payload["full_trace_hash"],
              "result_file_sha256": file_sha,
          }
          print("AH_EXP_0013_SUMMARY=" + json.dumps(summary, sort_keys=True, separators=(",", ":")))
          PY

      - name: Upload confirmatory evidence
        uses: actions/upload-artifact@v4
        with:
          name: ah-exp-0013-confirmatory
          path: ah-exp-0013-confirmatory.json
          if-no-files-found: error
          retention-days: 90
