name: AH-EXP-0010 one-shot final holdout

on:
  push:
    branches:
      - phase-1-ah-exp-0010-preregistration
    paths:
      - .github/workflows/ah-exp-0010-final-holdout.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: ah-exp-0010-final-holdout
  cancel-in-progress: false

jobs:
  final-holdout:
    # The authorization commit that creates this workflow is the only push event
    # allowed to expose the holdout. Re-runs are refused by run_attempt below.
    if: github.event.head_commit.message == 'Authorize one-shot AH-EXP-0010 final holdout' && github.run_attempt == 1
    runs-on: ubuntu-latest
    env:
      BASELINE_SHA: 10b8072a856856c73f497f64efb88e226dac7e96
      EVIDENCE_JSON: ah-exp-0010-final-holdout.json
      EVIDENCE_MANIFEST: ah-exp-0010-evidence-manifest.txt
    steps:
      - name: Refuse any prior AH-EXP-0010 holdout run
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          prior_count="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ah-exp-0010-final-holdout.yml/runs?event=push&per_page=100" \
            --jq "[.workflow_runs[] | select((.id | tostring) != \"${CURRENT_RUN_ID}\")] | length")"
          if [ "${prior_count}" != "0" ]; then
            echo "Refusing holdout: a prior workflow run already exists (${prior_count})." >&2
            exit 91
          fi

      - name: Checkout immutable evaluation baseline
        uses: actions/checkout@v6
        with:
          ref: 10b8072a856856c73f497f64efb88e226dac7e96
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact authorized commit
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "Authorized baseline: ${BASELINE_SHA}"
          echo "Checked out commit: ${actual}"
          test "${actual}" = "${BASELINE_SHA}"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install frozen baseline
        run: python -m pip install -e .

      - name: Run sealed 512-schedule holdout exactly once
        env:
          GH_RUN_ID: ${{ github.run_id }}
          GH_RUN_ATTEMPT: ${{ github.run_attempt }}
          GH_WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from ahomeostasis.robust_counterfactual_holdout import run_final_holdout

          baseline = os.environ["BASELINE_SHA"]
          result = run_final_holdout()

          # Classification is derived only from the frozen evaluator's
          # preregistered falsification flags.
          classification = "SURVIVED" if result["hypothesis_survives"] else "FALSIFIED"
          envelope = {
              "evidence_schema": "AH-EXP-0010-final-holdout-v1",
              "authorized_baseline_sha": baseline,
              "github_run_id": os.environ["GH_RUN_ID"],
              "github_run_attempt": os.environ["GH_RUN_ATTEMPT"],
              "authorization_workflow_commit": os.environ["GH_WORKFLOW_SHA"],
              "classification": classification,
              "result": result,
          }
          Path(os.environ["EVIDENCE_JSON"]).write_text(
              json.dumps(envelope, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(envelope, indent=2, sort_keys=True))
          PY

      - name: Build evidence manifest
        run: |
          set -euo pipefail
          classification="$(python -c 'import json; print(json.load(open("ah-exp-0010-final-holdout.json"))["classification"])')"
          sha256="$(sha256sum "${EVIDENCE_JSON}" | awk '{print $1}')"
          {
            echo "experiment=AH-EXP-0010"
            echo "authorized_baseline_sha=${BASELINE_SHA}"
            echo "holdout_seed=10011"
            echo "holdout_candidates=512"
            echo "github_run_id=${GITHUB_RUN_ID}"
            echo "github_run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "authorization_workflow_commit=${GITHUB_SHA}"
            echo "classification=${classification}"
            echo "evidence_json_sha256=${sha256}"
          } | tee "${EVIDENCE_MANIFEST}"
          {
            echo "## AH-EXP-0010 final holdout"
            echo ""
            echo "- Baseline: \`${BASELINE_SHA}\`"
            echo "- Classification: **${classification}**"
            echo "- Evidence SHA-256: \`${sha256}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Preserve complete holdout evidence
        uses: actions/upload-artifact@v4
        with:
          name: ah-exp-0010-final-holdout-evidence
          path: |
            ah-exp-0010-final-holdout.json
            ah-exp-0010-evidence-manifest.txt
          if-no-files-found: error
          retention-days: 90
