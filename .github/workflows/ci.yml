name: CI

on:
  push:
    branches: [main, phase-0-scientific-baseline, phase-1-cross-environment-replication, phase-1-stochastic-replication, phase-1-adversarial-robustness, phase-1-overregulation-detector, phase-1-counterfactual-regulation-implementation, ah-exp-0009-final-holdout]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .[dev]
      - run: python -m pytest
      - run: python -m ahomeostasis.experiment
      - run: python -m ahomeostasis.attack
      - run: python -m ahomeostasis.ablation
      - run: python -m ahomeostasis.robustness
      - run: python -m ahomeostasis.queue_replication
      - run: python -m ahomeostasis.stochastic_replication
      - run: python -m ahomeostasis.adversarial_robustness
      - run: python -m ahomeostasis.overregulation_detector
      - run: python -m ahomeostasis.counterfactual_regulation --calibration-only
